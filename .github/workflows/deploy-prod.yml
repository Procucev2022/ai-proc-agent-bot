name: Deploy Prod - Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_base_rebuild:
        description: 'Rebuild the shared dependency image even if its tag already exists'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: prod-deployment
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-aiproc-prod
  ACR_NAME: acraiprocprod
  LOCATION: centralindia
  ENVIRONMENT: prod

jobs:
  unit-tests:
    uses: ./.github/workflows/unit-tests.yml

  build-and-deploy:
    needs: unit-tests
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Azure Secrets Present
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          WHATSAPP_USERNAME: ${{ secrets.WHATSAPP_USERNAME }}
          WHATSAPP_PASSWORD: ${{ secrets.WHATSAPP_PASSWORD }}
          GMT_BASE_URL: ${{ secrets.GMT_BASE_URL }}
          GMT_USERNAME: ${{ secrets.GMT_USERNAME }}
          GMT_PASSWORD: ${{ secrets.GMT_PASSWORD }}
          GMT_PHONE: ${{ secrets.GMT_PHONE }}
          GMT_CLIENT_ID: ${{ secrets.GMT_CLIENT_ID }}
          GMT_CLIENT_SECRET: ${{ secrets.GMT_CLIENT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.PROD_DATABASE_URL }}
        run: |
          required=(AZURE_OPENAI_ENDPOINT AZURE_OPENAI_API_KEY WHATSAPP_API_KEY WHATSAPP_USERNAME WHATSAPP_PASSWORD GMT_BASE_URL GMT_USERNAME GMT_PASSWORD GMT_PHONE GMT_CLIENT_ID GMT_CLIENT_SECRET DATABASE_URL)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing required secret $name"; exit 1; fi
          done
          if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ] && [ -z "${{ secrets.AZURE_CLIENT_ID }}" ]; then
            echo "::error title=Missing Azure Secrets::No Azure authentication secrets found!"
            echo "--------------------------------------------------------------------------------"
            echo "To fix this issue, please add one of the following secret configurations in GitHub:"
            echo "Option 1 (OIDC - Recommended):"
            echo "  - AZURE_CLIENT_ID"
            echo "  - AZURE_TENANT_ID"
            echo "  - AZURE_SUBSCRIPTION_ID"
            echo "Option 2 (Service Principal JSON):"
            echo "  - AZURE_CREDENTIALS (Output of: az ad sp create-for-rbac --sdk-auth)"
            echo "--------------------------------------------------------------------------------"
            exit 1
          fi

      - name: Azure Login (Supports OIDC or Service Principal JSON)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Register Required Azure Resource Providers
        run: |
          # Registration is permanent per subscription. Re-running
          # 'az provider register --wait' on every deploy only re-confirms what
          # is already true, so check the state first and skip the call.
          echo "Checking Azure Resource Providers..."
          for provider in Microsoft.ContainerRegistry Microsoft.App Microsoft.OperationalInsights Microsoft.Storage; do
            state=$(az provider show --namespace "$provider" --query registrationState -o tsv 2>/dev/null || echo Unknown)
            if [ "$state" = "Registered" ]; then
              echo "✓ $provider already registered"
            else
              echo "Registering $provider (state: $state)..."
              az provider register --namespace "$provider" --wait
            fi
          done
          echo "✓ All required Resource Providers are registered."

      - name: Ensure Azure Resource Group & ACR Exist
        run: |
          echo "Checking Resource Group '${{ env.RESOURCE_GROUP }}'..."
          if ! az group show --name ${{ env.RESOURCE_GROUP }} &>/dev/null; then
            echo "Creating Resource Group '${{ env.RESOURCE_GROUP }}' in location '${{ env.LOCATION }}'..."
            az group create --name ${{ env.RESOURCE_GROUP }} --location ${{ env.LOCATION }} --output table
          else
            RG_LOC=$(az group show --name ${{ env.RESOURCE_GROUP }} --query location -o tsv)
            echo "✓ Resource Group '${{ env.RESOURCE_GROUP }}' already exists in location '$RG_LOC'."
            echo "LOCATION=$RG_LOC" >> $GITHUB_ENV
          fi

          echo "Ensuring Azure Container Registry '${{ env.ACR_NAME }}' exists..."
          if ! az acr show --name ${{ env.ACR_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} &>/dev/null; then
            echo "ACR '${{ env.ACR_NAME }}' not found. Creating basic ACR..."
            az acr create --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.ACR_NAME }} --sku Basic --admin-enabled true --output table
          else
            echo "✓ ACR '${{ env.ACR_NAME }}' already exists."
          fi

      - name: Log in to Azure Container Registry (ACR) & Get Credentials
        id: acr
        run: |
          az acr login --name ${{ env.ACR_NAME }}
          SERVER=$(az acr show --name ${{ env.ACR_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --query loginServer -o tsv)
          USER=$(az acr credential show --name ${{ env.ACR_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --query username -o tsv)
          PASS=$(az acr credential show --name ${{ env.ACR_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --query "passwords[0].value" -o tsv)
          echo "::add-mask::$PASS"
          echo "server=$SERVER" >> $GITHUB_OUTPUT
          echo "ACR_USER=$USER" >> $GITHUB_ENV
          echo "ACR_PASS=$PASS" >> $GITHUB_ENV

      # ACR quick tasks run on a fresh agent with no layer cache and az acr
      # build has no --cache-from, so the only way to stop reinstalling ~2GB of
      # wheels on every deploy is to publish the dependency layers as their own
      # image. The tag is keyed on the hash of the files that produce them, so a
      # deploy that changes neither requirements.txt nor Dockerfile.base reuses
      # it. ACR authenticates to its own registry automatically, so the app
      # build can pull it as a base image with no extra credentials.
      - name: Resolve Shared Dependency Image
        id: base
        env:
          FORCE_BASE_REBUILD: ${{ github.event.inputs.force_base_rebuild }}
        run: |
          set -euo pipefail
          DEPS_HASH=$(cat requirements.txt Dockerfile.base | sha256sum | cut -c1-12)
          BASE_REPO=aiproc-base
          BASE_TAG="py311-${DEPS_HASH}"
          echo "image=${BASE_REPO}:${BASE_TAG}" >> "$GITHUB_OUTPUT"

          if [ "${FORCE_BASE_REBUILD:-false}" = "true" ]; then
            echo "Forced rebuild requested for ${BASE_REPO}:${BASE_TAG}."
          elif az acr repository show-tags --name ${{ env.ACR_NAME }} --repository "$BASE_REPO" -o tsv 2>/dev/null \
               | grep -qx "$BASE_TAG"; then
            echo "✓ Reusing existing ${BASE_REPO}:${BASE_TAG}, skipping the dependency install."
            exit 0
          else
            echo "No cached ${BASE_REPO}:${BASE_TAG} found (requirements or base image changed)."
          fi

          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image "${BASE_REPO}:${BASE_TAG}" \
            --file Dockerfile.base .

      # One build, two tags. The app image already contains everything the old
      # Celery image did, and both Celery container apps override the command in
      # infra/modules/celery-worker.bicep, so a second build produced a second
      # copy of the same bytes. Pushing both repository names keeps each
      # container app's tag history intact and leaves infra/main.bicep unchanged.
      - name: Build & Push Container Image to ACR (Single Build, Both Tags)
        env:
          BASE_IMAGE_REF: ${{ steps.acr.outputs.server }}/${{ steps.base.outputs.image }}
        run: |
          set -euo pipefail
          # Tag by commit, not by branch name. Deriving the tag from
          # GITHUB_REF_NAME produced a single mutable "prod-main" tag that every
          # release overwrote, so the running image could not be traced back to a
          # commit. The dev workflow already tags by short SHA.
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG_APP="aiproc-app:prod-${SHORT_SHA}"
          TAG_CELERY="aiproc-celery:prod-${SHORT_SHA}"

          echo "Building '$TAG_APP' and '$TAG_CELERY' from Dockerfile.app on $BASE_IMAGE_REF..."
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image "$TAG_APP" \
            --image "aiproc-app:latest" \
            --image "$TAG_CELERY" \
            --image "aiproc-celery:latest" \
            --build-arg "BASE_IMAGE=$BASE_IMAGE_REF" \
            --file Dockerfile.app .

          echo "TAG_APP=$TAG_APP" >> $GITHUB_ENV
          echo "TAG_CELERY=$TAG_CELERY" >> $GITHUB_ENV

      - name: Deploy Azure Infrastructure & Container Apps (Bicep)
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: ./infra/main.bicep
          failOnStdErr: false
          parameters: >
            environment=${{ env.ENVIRONMENT }}
            location=${{ env.LOCATION }}
            baseName=aiproc
            acrServer=${{ steps.acr.outputs.server }}
            acrUsername="${{ env.ACR_USER }}"
            acrPassword="${{ env.ACR_PASS }}"
            appImageTag=${{ env.TAG_APP }}
            celeryImageTag=${{ env.TAG_CELERY }}
            databaseUrl="${{ secrets.DATABASE_URL || secrets.PROD_DATABASE_URL }}"
            azureOpenAiEndpoint="${{ secrets.AZURE_OPENAI_ENDPOINT }}"
            azureOpenAiKey="${{ secrets.AZURE_OPENAI_API_KEY }}"
            whatsappApiKey="${{ secrets.WHATSAPP_API_KEY }}"
            whatsappFromNumber="${{ secrets.WHATSAPP_FROM_NUMBER || '917996170801' }}"
            whatsappMockMode="${{ secrets.WHATSAPP_MOCK_MODE || 'false' }}"
            whatsappUsername="${{ secrets.WHATSAPP_USERNAME }}"
            whatsappPassword="${{ secrets.WHATSAPP_PASSWORD }}"
            gmtBaseUrl="${{ secrets.GMT_BASE_URL }}"
            gmtUsername="${{ secrets.GMT_USERNAME }}"
            gmtPassword="${{ secrets.GMT_PASSWORD }}"
            gmtPhone="${{ secrets.GMT_PHONE }}"
            gmtClientId="${{ secrets.GMT_CLIENT_ID }}"
            gmtClientSecret="${{ secrets.GMT_CLIENT_SECRET }}"

      - name: Get Production URL & Verify Health Endpoint
        run: |
          APP_URL=$(az containerapp show --name aiproc-app-prod --resource-group ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)
          echo "Production Application URL: https://${APP_URL}"
          
          echo "Warming up application (waiting 20s for container initialization)..."
          sleep 20
          
          echo "Running Smoke Test on Health Endpoint..."
          curl -f --max-time 30 --retry 10 --retry-delay 10 --retry-connrefused "https://${APP_URL}/health" || exit 1
          echo "✓ Production Deployment Successfully Verified!"
