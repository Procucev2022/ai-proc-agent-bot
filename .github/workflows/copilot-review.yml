name: Request Copilot Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: copilot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request-copilot-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.COPILOT_REVIEW_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Request Copilot review
        run: |
          gh api --method POST "repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" \
            -f 'reviewers[]=copilot-pull-request-reviewer[bot]' > /dev/null