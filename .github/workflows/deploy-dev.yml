name: Deploy Dev - Azure Container Apps

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: dev-deployment
  cancel-in-progress: true

env:
  RESOURCE_GROUP: rg-aiproc-dev
  ACR_NAME: acraiprocdev
  LOCATION: centralindia
  ENVIRONMENT: dev

jobs:
  unit-tests:
    name: Unit Tests & Coverage Gate
    runs-on: ubuntu-latest
    env:
      # Deterministic placeholders; the unit suite mocks every external service.
      # Keep these in step with tests/conftest.py and pr-quality-gate.yml.
      # The sqlite URLs MUST stay quoted: a trailing colon in a plain scalar
      # makes YAML read the value as a nested mapping, which silently
      # invalidates the whole workflow file.
      AZURE_OPENAI_API_KEY: unit-test-key
      GMT_USERNAME: unit-test-user
      GMT_PHONE: '919876543229'
      GMT_BASE_URL: https://gmt.invalid
      GMT_PASSWORD: unit-test-password
      GMT_CLIENT_ID: unit-test-client-id
      GMT_CLIENT_SECRET: unit-test-client-secret
      LOCAL_DATABASE_URL: 'sqlite:///:memory:'
      REMOTE_DATABASE_URL: 'sqlite:///:memory:'
      DATABASE_MODE: local
      LICENSE_ENABLED: 'false'
      WHATSAPP_MOCK_MODE: 'true'
      WEBHOOK_HEALTH_MONITORING_ENABLED: 'false'
      PYTHONPATH: .

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # sentence-transformers pulls torch, which defaults to the multi-GB
          # CUDA wheels. Dockerfile.app and pr-quality-gate.yml install the CPU
          # build first for the same reason; the runner has no GPU either.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Run Unit Tests with Coverage
        run: python -m coverage run --branch -m pytest

      - name: Build Coverage Report
        run: python -m coverage json -o coverage.json

      - name: Enforce Per-File Coverage
        run: python scripts/check_coverage.py --coverage-file coverage.json --threshold 90

      - name: Enforce Aggregate Coverage
        run: python -m coverage report --fail-under=90

  build-and-deploy:
    needs: unit-tests
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Azure Secrets Present
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          WHATSAPP_USERNAME: ${{ secrets.WHATSAPP_USERNAME }}
          WHATSAPP_PASSWORD: ${{ secrets.WHATSAPP_PASSWORD }}
          GMT_BASE_URL: ${{ secrets.GMT_BASE_URL }}
          GMT_USERNAME: ${{ secrets.GMT_USERNAME }}
          GMT_PASSWORD: ${{ secrets.GMT_PASSWORD }}
          GMT_PHONE: ${{ secrets.GMT_PHONE }}
          GMT_CLIENT_ID: ${{ secrets.GMT_CLIENT_ID }}
          GMT_CLIENT_SECRET: ${{ secrets.GMT_CLIENT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DEV_DATABASE_URL }}
        run: |
          required=(AZURE_OPENAI_ENDPOINT AZURE_OPENAI_API_KEY WHATSAPP_API_KEY WHATSAPP_USERNAME WHATSAPP_PASSWORD GMT_BASE_URL GMT_USERNAME GMT_PASSWORD GMT_PHONE GMT_CLIENT_ID GMT_CLIENT_SECRET DATABASE_URL)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing required secret $name"; exit 1; fi
          done
          if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ] && [ -z "${{ secrets.AZURE_CLIENT_ID }}" ]; then
            echo "::error title=Missing Azure Secrets::No Azure authentication secrets found!"
            echo "--------------------------------------------------------------------------------"
            echo "To fix this issue, please add one of the following secret configurations in GitHub:"
            echo "Option 1 (OIDC - Recommended):"
            echo "  - AZURE_CLIENT_ID"
            echo "  - AZURE_TENANT_ID"
            echo "  - AZURE_SUBSCRIPTION_ID"
            echo "Option 2 (Service Principal JSON):"
            echo "  - AZURE_CREDENTIALS (Output of: az ad sp create-for-rbac --sdk-auth)"
            echo "--------------------------------------------------------------------------------"
            exit 1
          fi

      - name: Azure Login (Supports OIDC or Service Principal JSON)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Register Required Azure Resource Providers
        run: |
          echo "Checking and registering Azure Resource Providers..."
          for provider in Microsoft.ContainerRegistry Microsoft.App Microsoft.OperationalInsights Microsoft.Storage; do
            echo "Registering $provider..."
            az provider register --namespace "$provider" --wait
          done
          echo "✓ All required Resource Providers are registered."

      - name: Ensure Azure Resource Group & ACR Exist
        run: |
          echo "Checking Resource Group '${{ env.RESOURCE_GROUP }}'..."
          if ! az group show --name ${{ env.RESOURCE_GROUP }} &>/dev/null; then
            echo "Creating Resource Group '${{ env.RESOURCE_GROUP }}' in location '${{ env.LOCATION }}'..."
            az group create --name ${{ env.RESOURCE_GROUP }} --location ${{ env.LOCATION }} --output table
          else
            RG_LOC=$(az group show --name ${{ env.RESOURCE_GROUP }} --query location -o tsv)
            echo "✓ Resource Group '${{ env.RESOURCE_GROUP }}' already exists in location '$RG_LOC'."
            echo "LOCATION=$RG_LOC" >> $GITHUB_ENV
          fi

          echo "Ensuring Azure Container Registry '${{ env.ACR_NAME }}' exists..."
          if ! az acr show --name ${{ env.ACR_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} &>/dev/null; then
            echo "ACR '${{ env.ACR_NAME }}' not found. Creating basic ACR..."
            az acr create --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.ACR_NAME }} --sku Basic --admin-enabled true --output table
          else
            echo "✓ ACR '${{ env.ACR_NAME }}' already exists."
          fi

      - name: Log in to Azure Container Registry (ACR) & Get Credentials
        id: acr
        run: |
          az acr login --name ${{ env.ACR_NAME }}
          SERVER=$(az acr show --name ${{ env.ACR_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --query loginServer -o tsv)
          USER=$(az acr credential show --name ${{ env.ACR_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --query username -o tsv)
          PASS=$(az acr credential show --name ${{ env.ACR_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --query "passwords[0].value" -o tsv)
          echo "::add-mask::$PASS"
          echo "server=$SERVER" >> $GITHUB_OUTPUT
          echo "ACR_USER=$USER" >> $GITHUB_ENV
          echo "ACR_PASS=$PASS" >> $GITHUB_ENV

      - name: Build & Push Container Images to ACR (Unified Build)
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG_APP="aiproc-app:dev-${SHORT_SHA}"
          TAG_CELERY="aiproc-celery:dev-${SHORT_SHA}"
          
          echo "Building application image '$TAG_APP'..."
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image "$TAG_APP" \
            --file Dockerfile.app .
          echo "Building Celery image '$TAG_CELERY'..."
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image "$TAG_CELERY" \
            --file Dockerfile.celery .
          
          echo "TAG_APP=$TAG_APP" >> $GITHUB_ENV
          echo "TAG_CELERY=$TAG_CELERY" >> $GITHUB_ENV

      - name: Deploy Azure Infrastructure & Container Apps (Bicep)
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: ./infra/main.bicep
          failOnStdErr: false
          parameters: >
            environment=${{ env.ENVIRONMENT }}
            location=${{ env.LOCATION }}
            baseName=aiproc
            acrServer=${{ steps.acr.outputs.server }}
            acrUsername="${{ env.ACR_USER }}"
            acrPassword="${{ env.ACR_PASS }}"
            appImageTag=${{ env.TAG_APP }}
            celeryImageTag=${{ env.TAG_CELERY }}
            databaseUrl="${{ secrets.DATABASE_URL || secrets.DEV_DATABASE_URL }}"
            azureOpenAiEndpoint="${{ secrets.AZURE_OPENAI_ENDPOINT }}"
            azureOpenAiKey="${{ secrets.AZURE_OPENAI_API_KEY }}"
            whatsappApiKey="${{ secrets.WHATSAPP_API_KEY }}"
            whatsappFromNumber="${{ secrets.WHATSAPP_FROM_NUMBER }}"
            whatsappMockMode="${{ secrets.WHATSAPP_MOCK_MODE }}"
            whatsappUsername="${{ secrets.WHATSAPP_USERNAME }}"
            whatsappPassword="${{ secrets.WHATSAPP_PASSWORD }}"
            gmtBaseUrl="${{ secrets.GMT_BASE_URL }}"
            gmtUsername="${{ secrets.GMT_USERNAME }}"
            gmtPassword="${{ secrets.GMT_PASSWORD }}"
            gmtPhone="${{ secrets.GMT_PHONE }}"
            gmtClientId="${{ secrets.GMT_CLIENT_ID }}"
            gmtClientSecret="${{ secrets.GMT_CLIENT_SECRET }}"

      - name: Get App URL & Run Health Check Probe
        run: |
          APP_URL=$(az containerapp show --name aiproc-app-dev --resource-group ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)
          echo "App URL: https://${APP_URL}"
          
          echo "Warming up application (waiting 20s for serverless cold start)..."
          sleep 20
          
          echo "Testing Health Endpoint..."
          curl -f --max-time 30 --retry 10 --retry-delay 10 --retry-connrefused "https://${APP_URL}/health" || exit 1
          echo "✓ Dev Deployment Successfully Verified!"
