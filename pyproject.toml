[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[project]
# Metadata only. Runtime dependencies are installed from requirements.txt by
# both the Docker images and CI; this table exists so the declared setuptools
# backend can actually produce a distribution, which is what the "Build" step
# of the PR quality gate verifies.
name = "ai-proc-agent-bot"
version = "1.0.0"
description = "AI procurement agent: WhatsApp-driven procurement automation service"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
timeout = 60
timeout_method = "thread"
addopts = ["-ra", "--strict-markers"]
markers = [
    "unit: deterministic tests that do not require external services",
    "integration: tests requiring external services or infrastructure",
    "manual: scripts/tests intended for local, manual execution",
]

[tool.mypy]
python_version = "3.13"
files = ["app"]
# Third-party packages here (celery, pgeocode, ...) ship no stubs and
# the codebase is only partially annotated. The PR gate therefore blocks
# *regressions* against quality-baseline.json instead of demanding a full
# annotation pass. Tighten these settings as the baseline ratchets down.
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true
show_error_codes = true
exclude = ['^app/logs/']

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 90.0
precision = 2
skip_empty = false
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.coverage.json]
pretty_print = true
show_contexts = false

[tool.setuptools.packages.find]
include = ["app*"]
