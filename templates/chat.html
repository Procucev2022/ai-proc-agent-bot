<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Procurement Agent - Chat Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 800px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #075e54;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #e5ddd5;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user .message-bubble {
            background: #dcf8c6;
            color: #333;
        }

        .message.bot .message-bubble {
            background: white;
            color: #333;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
            text-align: right;
        }

        .chat-input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .chat-input-form {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .chat-input:focus {
            border-color: #075e54;
        }

        .send-button {
            background: #075e54;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .send-button:hover {
            background: #064943;
        }

        .send-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .file-upload-section {
            margin-top: 10px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 2px dashed #ddd;
        }

        .file-upload-form {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .file-input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .upload-button {
            background: #25d366;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .upload-button:hover {
            background: #22c55e;
        }

        .upload-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .file-upload-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #075e54;
        }

        .typing-indicator {
            display: none;
            padding: 10px;
            font-style: italic;
            color: #666;
        }

        .debug-info {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 10px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 12px;
            color: #6c757d;
            max-height: 100px;
            overflow-y: auto;
        }

        .debug-dropdown {
            margin-top: 10px;
        }

        .debug-toggle {
            background: #6c757d;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: background-color 0.3s;
        }

        .debug-toggle:hover {
            background: #5a6268;
        }

        .debug-content {
            display: none;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 10px;
            margin-top: 5px;
            font-family: monospace;
            font-size: 12px;
            color: #6c757d;
            max-height: 100px;
            overflow-y: auto;
        }

        .phone-display {
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>AI Procurement Agent</h1>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="message-bubble">
                    Welcome! I'm your AI Procurement Assistant. I can help you create RFQs and check product availability. What would you like to procure today?
                    <div class="message-time" id="welcomeTime"></div>
                </div>
            </div>
        </div>
        
        <div class="typing-indicator" id="typingIndicator">
            Bot is typing...
        </div>
        
        <div class="chat-input-container">
            <form class="chat-input-form" id="chatForm">
                <input 
                    type="text" 
                    class="chat-input" 
                    id="messageInput" 
                    placeholder="Type your message here..." 
                    autocomplete="off"
                    required
                >
                <button type="submit" class="send-button" id="sendButton">Send</button>
            </form>
            
            <!-- Excel Upload Section -->
            
            
            <!-- Image Upload Section -->
           
        </div>
    </div>

    <script>
        // Configuration
        const PHONE_NUMBER = '917666834062';
        //7666834062
        // Set welcome message time
        document.getElementById('welcomeTime').textContent = new Date().toLocaleTimeString();

        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const typingIndicator = document.getElementById('typingIndicator');
        const chatForm = document.getElementById('chatForm');

        function addMessage(content, isUser = false, showDebug = false, debugInfo = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'message-bubble';
            bubbleDiv.textContent = content;
            
            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = new Date().toLocaleTimeString();
            
            bubbleDiv.appendChild(timeDiv);
            
            if (showDebug && debugInfo) {
                const debugDropdown = document.createElement('div');
                debugDropdown.className = 'debug-dropdown';
                
                const toggleButton = document.createElement('button');
                toggleButton.className = 'debug-toggle';
                toggleButton.textContent = 'Show Debug Info ▼';
                
                const debugContent = document.createElement('div');
                debugContent.className = 'debug-content';
                debugContent.textContent = JSON.stringify(debugInfo, null, 2);
                
                toggleButton.addEventListener('click', function() {
                    if (debugContent.style.display === 'none' || debugContent.style.display === '') {
                        debugContent.style.display = 'block';
                        toggleButton.textContent = 'Hide Debug Info ▲';
                    } else {
                        debugContent.style.display = 'none';
                        toggleButton.textContent = 'Show Debug Info ▼';
                    }
                });
                
                debugDropdown.appendChild(toggleButton);
                debugDropdown.appendChild(debugContent);
                bubbleDiv.appendChild(debugDropdown);
            }
            
            messageDiv.appendChild(bubbleDiv);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTyping() {
            typingIndicator.style.display = 'block';
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function hideTyping() {
            typingIndicator.style.display = 'none';
        }

        async function sendMessage(message) {
            if (!message.trim()) return;

            // Add user message
            addMessage(message, true);
            
            // Show typing indicator
            showTyping();
            sendButton.disabled = true;
            sendButton.textContent = 'Sending...';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        phone: PHONE_NUMBER
                    })
                });

                const data = await response.json();
                
                if (data.success && data.responses) {
                    // Add bot responses (same as terminal test)
                    data.responses.forEach(botResponse => {
                        addMessage(botResponse, false, true, data.debug_info);
                    });
                } else {
                    addMessage(data.error || 'Sorry, there was an error processing your message.', false);
                }
                
            } catch (error) {
                console.error('Error:', error);
                addMessage('Sorry, there was a connection error.', false);
            } finally {
                hideTyping();
                sendButton.disabled = false;
                sendButton.textContent = 'Send';
            }
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = messageInput.value;
            messageInput.value = '';
            await sendMessage(message);
        });

        // Focus on input when page loads
        messageInput.focus();

        // Handle Enter key
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });

        // File upload functionality
        const fileUploadForm = document.getElementById('fileUploadForm');
        const fileInput = document.getElementById('fileInput');
        const uploadButton = document.getElementById('uploadButton');

        async function uploadFile(file) {
            uploadButton.disabled = true;
            uploadButton.textContent = 'Uploading...';
            
            try {
                // Add file upload message to chat
                addMessage(`Uploading Excel file: ${file.name}`, true);
                
                // Show typing indicator
                typingIndicator.style.display = 'block';
                chatMessages.scrollTop = chatMessages.scrollHeight;

                // Create form data
                const formData = new FormData();
                formData.append('phone', PHONE_NUMBER);
                formData.append('file', file);

                const response = await fetch('/api/upload-excel', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                
                // Hide typing indicator
                typingIndicator.style.display = 'none';

                if (data.success) {
                    // Add responses from the bot
                    data.responses.forEach(response => {
                        addMessage(response, false, true, data.debug_info);
                    });
                } else {
                    addMessage(`Error: ${data.error}`, false);
                }

            } catch (error) {
                typingIndicator.style.display = 'none';
                addMessage(`Upload failed: ${error.message}`, false);
                console.error('Upload error:', error);
            } finally {
                uploadButton.disabled = false;
                uploadButton.textContent = 'Upload Excel';
                fileInput.value = ''; // Clear file input
            }
        }

        // Handle file upload form submission
        fileUploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = fileInput.files[0];
            if (file) {
                await uploadFile(file);
            }
        });

        // Image upload functionality
        const imageUploadForm = document.getElementById('imageUploadForm');
        const imageInput = document.getElementById('imageInput');
        const imageUploadButton = document.getElementById('imageUploadButton');

        async function uploadImage(file) {
            imageUploadButton.disabled = true;
            imageUploadButton.textContent = 'Uploading...';
            
            try {
                // Validate file size (max 10MB)
                const maxSize = 10 * 1024 * 1024; // 10MB
                if (file.size > maxSize) {
                    addMessage(`Error: File size exceeds 10MB limit`, false);
                    return;
                }
                
                // Add image upload message to chat
                addMessage(`Uploading image: ${file.name}`, true);
                
                // Show typing indicator
                typingIndicator.style.display = 'block';
                chatMessages.scrollTop = chatMessages.scrollHeight;

                // Convert image to base64
                const base64Data = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => {
                        const base64 = reader.result.split(',')[1]; // Remove data:image/...;base64, prefix
                        resolve(base64);
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });

                // Create image message content (similar to WhatsApp webhook structure)
                const imageContent = {
                    image: {
                        filename: file.name,
                        mime_type: file.type,
                        data: base64Data
                    }
                };

                // Send through chat API
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: imageContent,
                        phone: PHONE_NUMBER
                    })
                });

                const data = await response.json();
                
                // Hide typing indicator
                typingIndicator.style.display = 'none';

                if (data.success && data.responses) {
                    // Add responses from the bot
                    data.responses.forEach(response => {
                        addMessage(response, false, true, data.debug_info);
                    });
                } else {
                    addMessage(`Error: ${data.error}`, false);
                }

            } catch (error) {
                typingIndicator.style.display = 'none';
                addMessage(`Upload failed: ${error.message}`, false);
                console.error('Image upload error:', error);
            } finally {
                imageUploadButton.disabled = false;
                imageUploadButton.textContent = 'Upload Image';
                imageInput.value = ''; // Clear file input
            }
        }

        // Handle image upload form submission
        imageUploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = imageInput.files[0];
            if (file) {
                await uploadImage(file);
            }
        });
    </script>
</body>
</html>
