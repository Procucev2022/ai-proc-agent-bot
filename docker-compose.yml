# ====================================================================
# AI Procurement Agent - Docker Compose Configuration
# ====================================================================
# This configuration sets up 4 containers for the procurement system:
# 1. Main Application (FastAPI + Gunicorn)
# 2. Redis (sessions on db 0, Celery on db 1)
# 3. Celery Worker (background task processing)
# 4. Celery Beat (task scheduler)
# ====================================================================

# PRODUCTION SETUP INFORMATION:
# ====================================================================
# SERVER PATH: /data/procucev_project/procucev_proc_agent/
# PORT MAPPING:
# - Main App: http://localhost:8005 (FastAPI + WhatsApp webhook)
# - Redis: localhost:6379 (DB 0: sessions, DB 1: Celery)
# - No external ports for Celery (internal communication only)
#
# VOLUME MOUNTS:
# - .env file: /data/procucev_project/procucev_proc_agent/.env
# - Logs: /data/procucev_project/procucev_proc_agent/logs/
# - SSL: /data/procucev_project/procucev_proc_agent/ssl/
#
# RESOURCE ALLOCATION (64GB RAM + 32GB Swap, 8-16 CPU cores):
# Strategy: 25% Reserved (16GB) + 75% Dynamic (48GB)
#
# RESERVED (16GB):
# - System OS: 2GB
# - Redis: 2GB
# - Monitoring/overhead: 4GB
#
# DYNAMIC (48GB) - DAY MODE (6 AM - 10 PM):
# - App: 24GB (heavy WhatsApp traffic, real-time requests)
# - Celery: 16GB (background tasks secondary)
#
# DYNAMIC (48GB) - NIGHT MODE (10 PM - 6 AM):
# - App: 8GB (minimal traffic)
# - Celery: 32GB (heavy batch processing)
#
# ENVIRONMENT VARIABLES TO CONTROL MODE:
# - SERVER_MODE=day (6 AM - 10 PM) - Default
# - SERVER_MODE=night (10 PM - 6 AM)
# Set in .env file or via docker-compose override
#
# HEALTH CHECKS:
# - App: GET http://localhost:8005/health
# - Redis: redis-cli ping
# ====================================================================

services:
  # ============================================================================
  # MAIN APPLICATION SERVICE - FASTAPI WITH GUNICORN
  # ============================================================================
  # Handles all HTTP/HTTPS traffic including WhatsApp webhooks, user APIs,
  # and frontend serving. Scales horizontally with multiple Gunicorn workers.
  app:
    container_name: procucev_main_app
    build:
      context: .
      dockerfile: Dockerfile.app
    ports:
      - "8005:8005"  # Main application port (host:container)
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - ENABLE_VECTOR_SEARCH=false  # ChromaDB removed; items are left uncategorized
      - WORKERS=${APP_WORKERS:-10}  # 10 workers × ~1.6GB = ~16GB
      - WORKER_THREADS=${APP_WORKER_THREADS:-2}
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - TQDM_DISABLE=1
      - HF_HUB_DISABLE_PROGRESS_BARS=1
    volumes:
      - ./logs:/app/logs  # Log persistence for rotation and analysis
      - /data/procucev_project/procucev_proc_agent/ssl:/app/ssl:ro  # SSL certs (read-only)
    networks:
      - procucev_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${APP_CPU_LIMIT:-4}'
          memory: '${APP_MEMORY_LIMIT:-16G}'  # 16GB for 10 workers
        reservations:
          cpus: '${APP_CPU_RESERVE:-3}'
          memory: '${APP_MEMORY_RESERVE:-12G}'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================================
  # DATA STORE - REDIS
  # ============================================================================
  redis:
    container_name: procucev_redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - procucev_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2.5G  # 2GB + 0.5GB buffer
        reservations:
          cpus: '1'
          memory: 2G
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # BACKGROUND TASK PROCESSING - CELERY WORKERS (3-POOL ARCHITECTURE)
  # ============================================================================
  celery_worker:
    container_name: procucev_celery_worker
    # Same image as the app service. Dockerfile.celery was a copy of
    # Dockerfile.app with a different CMD, so it installed the same
    # dependencies a second time for no gain; the command is set here instead.
    build:
      context: .
      dockerfile: Dockerfile.app
    command: ./docker_entrypoint_celery.sh
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CELERY_APP=app.celery_app
      - C_FORCE_ROOT=1
      - ENABLE_VECTOR_SEARCH=false  # ChromaDB removed; categorization tasks skip
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-1}
      - CELERY_SINGLE_WORKER=true
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - TQDM_DISABLE=1
      - HF_HUB_DISABLE_PROGRESS_BARS=1
    volumes:
      - ./logs:/app/logs
      - /data/procucev_project/procucev_proc_agent/ssl:/app/ssl:ro
    networks:
      - procucev_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${CELERY_CPU_LIMIT:-1}'
          memory: '${CELERY_MEMORY_LIMIT:-2G}'
        reservations:
          cpus: '${CELERY_CPU_RESERVE:-1}'
          memory: '${CELERY_MEMORY_RESERVE:-2G}'
    healthcheck:
      test: ["CMD", "celery", "-A", "app.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery_beat:
    container_name: procucev_celery_beat
    build:
      context: .
      dockerfile: Dockerfile.app
    command: celery -A app.celery_app beat --loglevel=info --scheduler=celery.beat:PersistentScheduler --schedule=/app/celerybeat-data/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CELERY_APP=app.celery_app
      - C_FORCE_ROOT=1
    volumes:
      - ./logs:/app/logs
      - celery_beat_data:/app/celerybeat-data
    networks:
      - procucev_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "celery", "-A", "app.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

# Persistent Storage
volumes:
  redis_data:
    driver: local
  celery_beat_data:
    driver: local

# Network
networks:
  procucev_network:
    driver: bridge
    name: procucev_network